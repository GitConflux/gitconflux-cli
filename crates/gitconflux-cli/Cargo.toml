[package]
name = "gitconflux-cli"
description = "The official GitConflux command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "gcflx"
path = "src/main.rs"

[dependencies]
gitconflux-core = { path = "../gitconflux-core" }
gitconflux-api = { path = "../gitconflux-api" }
clap.workspace = true
rpassword = "7"
serde_json.workspace = true
tokio = { version = "1", features = ["rt"] }
thiserror = "2"

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"
